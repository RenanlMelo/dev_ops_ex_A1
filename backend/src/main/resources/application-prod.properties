# Ativado com SPRING_PROFILES_ACTIVE=prod.
# Ajusta os defaults de application.properties para um ambiente de producao:
# esconde SQL nos logs e desativa o console do H2. ddl-auto continua em
# "update" por nao haver ferramenta de migration (Flyway/Liquibase) no
# projeto ainda; troque para "validate" se isso for adicionado depois.
# Cada valor continua sobrescritivel por variavel de ambiente.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
