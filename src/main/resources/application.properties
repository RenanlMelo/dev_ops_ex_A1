spring.application.name=dev_ops_ac1

server.port=${SERVER_PORT:8080}

# H2 file-based: os dados persistem em disco entre reinicios da aplicacao.
# Cada propriedade pode ser sobrescrita por variavel de ambiente (ex: no Docker).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/demodb;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
